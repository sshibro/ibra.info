<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spray-burst</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#1a1630; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        if (innerWidth < 8 || innerHeight < 8) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      const parts = Array.from({length: 90}, () => ({ a: Math.random()*Math.PI*2, s: 40+Math.random()*180, hue: 200+Math.random()*80 }));
      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height;
        const t = ((now || 0) % 1600) / 1600;
        ctx.fillStyle = "#1a1630";
        ctx.fillRect(0, 0, w, h);
        parts.forEach((p) => {
          const r = p.s * (quiet ? 0.7 : t);
          ctx.fillStyle = "hsla(" + p.hue + ",80%,70%," + (1-t) + ")";
          ctx.beginPath();
          ctx.arc(w/2 + Math.cos(p.a)*r, h/2 + Math.sin(p.a)*r, 3 + (1-t)*4, 0, Math.PI*2);
          ctx.fill();
        });
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
