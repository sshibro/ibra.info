<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spray-burst</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #efe8d8; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        if (innerWidth < 8 || innerHeight < 8) return;
        const w = Math.floor(innerWidth);
        const h = Math.floor(innerHeight);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }
      function paint(now) {
        fit();
        if (canvas.width < 8) return;
        const w = canvas.width, h = canvas.height, t = (now || 0) / 1400;
        ctx.fillStyle = "#efe8d8";
        ctx.fillRect(0, 0, w, h);
        const cx = w * 0.5, cy = h * 0.5;
        const rw = w * 0.72, rh = h * 0.7;
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx, cy, rw / 2, rh / 2, 0, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = "#2f6fe0";
        ctx.fillRect(0, 0, w, h);
        const petals = 10;
        ctx.fillStyle = "#f2d24a";
        ctx.translate(cx, cy);
        ctx.rotate(quiet ? 0.2 : t * 0.35);
        for (let i = 0; i < petals; i++) {
          ctx.rotate((Math.PI * 2) / petals);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(rw * 0.08, rh * 0.08);
          ctx.lineTo(0, rh * 0.38);
          ctx.lineTo(-rw * 0.08, rh * 0.08);
          ctx.closePath();
          ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(0, 0, Math.min(w, h) * 0.045, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = "rgba(20,16,10,0.04)";
        for (let i = 0; i < 80; i++) {
          ctx.fillRect((i * 47 + t * 30) % w, (i * 31) % h, 1.2, 1.2);
        }
      }
      function loop(now) {
        raf = 0;
        if (!view) return;
        paint(now);
        if (!quiet) raf = requestAnimationFrame(loop);
      }
      paint(0);
      if (!quiet) raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
