<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ink-flood</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#f4f4f1; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      const blobs = Array.from({length: 7}, (_, i) => ({
        x: 0.2 + (i % 3) * 0.3, y: 0.4 + (i % 2) * 0.2, r: 0.12 + i * 0.01, p: i
      }));
      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 1000;
        ctx.fillStyle = "#f4f4f1";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#161412";
        ctx.beginPath();
        for (const b of blobs) {
          const x = (b.x + Math.sin(t * 0.7 + b.p) * 0.08) * w;
          const y = (b.y + Math.cos(t * 0.55 + b.p) * 0.06) * h;
          const r = (b.r + Math.sin(t + b.p) * 0.02) * Math.min(w, h);
          ctx.moveTo(x + r, y);
          ctx.arc(x, y, r, 0, Math.PI * 2);
        }
        ctx.fill("evenodd");
        ctx.filter = "blur(10px)";
        ctx.drawImage(canvas, 0, 0);
        ctx.filter = "none";
        ctx.globalCompositeOperation = "source-over";
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
