<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>flower-lattice</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #16361f; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;

      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });

      function fit() {
        if (innerWidth < 8 || innerHeight < 8) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }

      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height;
        if (w < 8) return;
        ctx.fillStyle = "#16361f";
        ctx.fillRect(0, 0, w, h);
        const cols = 14;
        const rows = 8;
        const gapX = w / (cols + 1);
        const gapY = h / (rows + 1);
        const r = Math.min(gapX, gapY) * 0.28;
        const t = quiet ? 0 : (now || 0) / 700;
        for (let j = 0; j < rows; j++) {
          for (let i = 0; i < cols; i++) {
            const pulse = 0.55 + 0.45 * Math.sin(t + i * 0.35 + j * 0.5);
            ctx.beginPath();
            ctx.arc((i + 1) * gapX, (j + 1) * gapY, r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(168,232,122," + (0.28 + pulse * 0.55) + ")";
            ctx.fill();
          }
        }
      }

      function loop(now) {
        raf = 0;
        if (!view) return;
        paint(now);
        if (!quiet) raf = requestAnimationFrame(loop);
      }

      paint(0);
      if (!quiet) raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
