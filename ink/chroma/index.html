<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chromatic glow — ink</title>
    <meta name="description" content="The word is blurred at a few sizes and added back. A warm copy and a cool copy drift apart." />
    <link rel="canonical" href="https://ibra.info/ink/chroma/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <header class="top">
        <h1>Chromatic glow</h1>
        <a class="close" href="../" aria-label="close">×</a>
      </header>
      <p class="essay">
        The word is blurred at a few sizes and added back. A warm copy and a cool copy drift apart; that gap is the rainbow edge. Lean it with the pointer.
      </p>
      <section class="play">
        <div class="play-head"><span>Playground</span></div>
        <div class="stage">
          <iframe src="preview.html" title="Chromatic glow"></iframe>
        </div>
        <form class="knobs">
        <label class="knob">
          <span>word</span>
          <input type="text" name="word" value="shibro" maxlength="16" autocomplete="off" />
        </label>
        <label class="knob">
          <span>warm</span>
          <input type="color" name="warm" value="#e8a54b" />
        </label>
        <label class="knob">
          <span>cool</span>
          <input type="color" name="cool" value="#6ea8c9" />
        </label>
        </form>
      </section>
      <p class="actions">
        <button type="button" class="copy-pill" data-copy-detail>Copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
