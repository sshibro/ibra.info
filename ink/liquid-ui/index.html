<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Liquid UI — ink</title>
    <meta name="description" content="SDF cards joined by a capsule, marched to SVG." />
    <link rel="canonical" href="https://ibra.info/ink/liquid-ui/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <p class="back"><a href="../">ink</a></p>
      <h1>Liquid UI</h1>
      <p class="lede">
        Two round boxes and a capsule bridge, fused with a polynomial smooth
        min, then marched to an SVG path. Drag the cards. The knob goes from a
        crisp joint to soft goo.
      </p>
      <div class="stage">
        <iframe src="preview.html" title="Liquid UI"></iframe>
      </div>
      <form class="knobs">
        <label class="knob">
          <span>goo</span>
          <input type="range" name="goo" min="8" max="60" value="28" />
          <output data-output="goo">28</output>
        </label>
      </form>
      <p class="actions">
        <button type="button" class="copy-code" data-copy-detail>copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
