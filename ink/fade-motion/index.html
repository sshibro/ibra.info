<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fade motion — ink</title>
    <meta name="description" content="A trail that looks like motion blur." />
    <link rel="canonical" href="https://ibra.info/ink/fade-motion/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <p class="back"><a href="../">ink</a></p>
      <h1>Fade motion</h1>
      <p class="lede">
        It looks like a blur. It is stacked copies of the word, each a little
        more gone. Move the pointer and the trail densifies where they pile up.
      </p>
      <div class="stage">
        <iframe src="preview.html" title="Fade motion"></iframe>
      </div>
      <form class="knobs">
        <label class="knob">
          <span>word</span>
          <input type="text" name="word" value="shibro" maxlength="14" autocomplete="off" />
        </label>
        <label class="knob">
          <span>copies</span>
          <input type="range" name="copies" min="12" max="80" value="36" />
          <output data-output="copies">36</output>
        </label>
      </form>
      <p class="actions">
        <button type="button" class="copy-code" data-copy-detail>copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
