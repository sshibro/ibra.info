<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>fade-motion</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #11110f; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {
        word: "shibro",
        copies: 36
      };

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true;
      let raf = 0;
      const trail = [];
      let held = false;
      let mx = 0.5;
      let my = 0.5;

      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });

      function label(s) {
        return String(s || "shibro").replace(/[^\x20-\x7E]/g, "").slice(0, 14) || "shibro";
      }

      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }

      canvas.addEventListener("pointermove", (e) => {
        const r = canvas.getBoundingClientRect();
        held = true;
        mx = (e.clientX - r.left) / r.width;
        my = (e.clientY - r.top) / r.height;
      });
      canvas.addEventListener("pointerleave", () => {
        held = false;
      });

      function loop(now) {
        raf = 0;
        if (!view) return;
        fit();
        const w = canvas.width;
        const h = canvas.height;
        const n = Math.max(8, Math.round(Number(CONFIG.copies)));
        let x = mx;
        let y = my;
        if (!held) {
          const t = (now || 0) / 1000;
          x = 0.5 + Math.sin(t * 1.1) * 0.28;
          y = 0.5 + Math.sin(t * 0.7) * 0.18;
        }
        trail.push({ x: x * w, y: y * h });
        while (trail.length > n) trail.shift();
        ctx.fillStyle = "#11110f";
        ctx.fillRect(0, 0, w, h);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "600 " + Math.floor(Math.min(w, h) * 0.16) + "px ui-sans-serif, system-ui, sans-serif";
        const word = label(CONFIG.word);
        trail.forEach((p, i) => {
          const a = ((i + 1) / trail.length) * 0.22;
          ctx.fillStyle = "rgba(180, 230, 255," + a.toFixed(3) + ")";
          ctx.fillText(word, p.x, p.y);
        });
        const last = trail[trail.length - 1];
        if (last) {
          ctx.fillStyle = "#e8f6ff";
          ctx.fillText(word, last.x, last.y);
        }
        if (quiet) return;
        raf = requestAnimationFrame(loop);
      }

      if (quiet) {
        fit();
        ctx.fillStyle = "#11110f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#e8f6ff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "600 42px ui-sans-serif, system-ui, sans-serif";
        ctx.fillText(label(CONFIG.word), canvas.width / 2, canvas.height / 2);
      } else {
        raf = requestAnimationFrame(loop);
      }

      window.setParams = (c) => {
        Object.assign(CONFIG, c);
      };
    </script>
  </body>
</html>
