<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>symbols</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #11110f; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {
        cell: 9,
        bands: 4
      };

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true;
      let raf = 0;
      const glyphs = [".", "+", "*", "#", "@", "o", "x"];
      const tints = ["#5c5c57", "#7aa2b2", "#c45c26", "#e8c36a", "#efe6c9", "#9bb7a0"];

      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });

      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }

      function sample(now) {
        const w = canvas.width;
        const h = canvas.height;
        const off = document.createElement("canvas");
        off.width = w;
        off.height = h;
        const o = off.getContext("2d");
        const g = o.createRadialGradient(w * 0.5, h * 0.48, 8, w * 0.5, h * 0.5, Math.min(w, h) * 0.42);
        g.addColorStop(0, "#fff");
        g.addColorStop(1, "#000");
        o.fillStyle = "#000";
        o.fillRect(0, 0, w, h);
        o.fillStyle = g;
        o.beginPath();
        o.ellipse(w * 0.5, h * 0.5, w * 0.28, h * 0.34, 0, 0, Math.PI * 2);
        o.fill();
        o.fillStyle = "#fff";
        o.font = "700 " + Math.floor(Math.min(w, h) * 0.2) + "px ui-sans-serif, system-ui, sans-serif";
        o.textAlign = "center";
        o.textBaseline = "middle";
        o.globalAlpha = 0.85;
        o.fillText("shibro", w / 2, h / 2);
        if (!quiet) {
          o.globalAlpha = 0.18;
          o.beginPath();
          o.arc(w * (0.35 + Math.sin(now / 1400) * 0.08), h * 0.38, 30, 0, Math.PI * 2);
          o.fill();
        }
        return o.getImageData(0, 0, w, h);
      }

      function paint(now) {
        fit();
        const img = sample(now || 0);
        const cell = Math.max(5, Math.round(Number(CONFIG.cell)));
        const bands = Math.max(3, Math.round(Number(CONFIG.bands)));
        ctx.fillStyle = "#11110f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = cell + "px ui-monospace, monospace";
        for (let y = cell / 2; y < canvas.height; y += cell) {
          for (let x = cell / 2; x < canvas.width; x += cell) {
            const i = (Math.floor(y) * img.width + Math.floor(x)) * 4;
            const lum = img.data[i] * 0.3 + img.data[i + 1] * 0.59 + img.data[i + 2] * 0.11;
            const b = Math.min(bands - 1, Math.floor((lum / 255) * bands));
            ctx.fillStyle = tints[b % tints.length];
            ctx.fillText(glyphs[b % glyphs.length], x, y);
          }
        }
      }

      function loop(now) {
        raf = 0;
        if (!view) return;
        paint(now);
        if (!quiet) raf = requestAnimationFrame(loop);
      }

      paint(0);
      if (!quiet) raf = requestAnimationFrame(loop);

      window.setParams = (c) => {
        Object.assign(CONFIG, c);
        paint(performance.now());
      };
    </script>
  </body>
</html>
