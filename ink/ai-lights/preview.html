<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ai-lights</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#050505; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 20;
        ctx.fillStyle = "#050505";
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 16; i++) {
          const x = ((i * 47 + t) % (w + 40)) - 20;
          ctx.fillStyle = "hsla(" + (90 + i*8) + ",80%,55%,0.55)";
          ctx.fillRect(x, 0, 3 + (i%3), h);
        }
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
