<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>datamosh</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#222; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        if (innerWidth < 8 || innerHeight < 8) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = "#222";
        ctx.fillRect(0, 0, w, h);
        ctx.font = "700 " + Math.floor(Math.min(w,h)*0.22) + "px ui-sans-serif,system-ui,sans-serif";
        ctx.fillStyle = "#f4f4f1";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("shibro", w/2, h/2);
        if (!quiet) {
          for (let i = 0; i < 8; i++) {
            const y = Math.random()*h, hh = 8+Math.random()*28, x = (Math.random()-0.5)*40;
            ctx.drawImage(canvas, 0, y, w, hh, x, y, w, hh);
          }
        }
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
