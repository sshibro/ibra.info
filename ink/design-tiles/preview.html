<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>design-tiles</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#eceae3; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 800;
        const cols = ["#111","#c45c26","#f4f4f1","#3d6b4f","#e8c36a","#6ea8c9"];
        const n = 6;
        const s = Math.min(w,h)/n;
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            const flip = (Math.sin(t + x + y) + 1) / 2;
            ctx.save();
            ctx.translate(x*s + s/2 + (w-n*s)/2, y*s + s/2 + (h-n*s)/2);
            ctx.scale(Math.max(0.08, Math.abs(Math.cos(t + x*0.4 + y))), 1);
            ctx.fillStyle = cols[(x+y) % cols.length];
            ctx.fillRect(-s/2+2, -s/2+2, s-4, s-4);
            ctx.restore();
          }
        }
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
