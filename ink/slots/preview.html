<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>slots</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f4f4f1;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .well {
        height: 1.15em;
        overflow: hidden;
        font-size: clamp(1.7rem, 8vw, 2.4rem);
        letter-spacing: -0.045em;
        line-height: 1.15;
      }
      .reel {
        display: flex;
        flex-direction: column;
        animation: roll 3.6s cubic-bezier(0.22, 0.8, 0.2, 1) infinite;
      }
      .reel span {
        display: block;
        height: 1.15em;
      }
      @keyframes roll {
        0%,
        18% {
          transform: translateY(0);
        }
        28%,
        48% {
          transform: translateY(-1.15em);
        }
        58%,
        78% {
          transform: translateY(-2.3em);
        }
        88%,
        100% {
          transform: translateY(-3.45em);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .reel {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="well" aria-hidden="true">
      <div class="reel">
        <span>design</span>
        <span>product</span>
        <span>type</span>
        <span>design</span>
      </div>
    </div>
    <script>
      const CONFIG = {};
    </script>
  </body>
</html>
