<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ember-fire</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#1a0a00; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      const cells = [];
      function paint(now) {
        fit();
        const w = 48, h = 32;
        if (!cells.length) for (let i = 0; i < w*h; i++) cells[i] = Math.random();
        for (let x = 0; x < w; x++) cells[(h-1)*w + x] = 0.6 + Math.random()*0.4;
        for (let y = 0; y < h-1; y++) {
          for (let x = 0; x < w; x++) {
            const i = y*w + x;
            const below = cells[(y+1)*w + x];
            const side = cells[(y+1)*w + ((x + (Math.random()<0.5?-1:1) + w) % w)];
            cells[i] = Math.max(0, (below*0.55 + side*0.35 + cells[i]*0.1) - 0.02);
          }
        }
        const img = ctx.createImageData(canvas.width = innerWidth, canvas.height = innerHeight);
        const sx = canvas.width / w, sy = canvas.height / h;
        for (let y = 0; y < canvas.height; y++) {
          for (let x = 0; x < canvas.width; x++) {
            const v = cells[Math.floor(y/sy)*w + Math.floor(x/sx)];
            const i = (y*canvas.width + x)*4;
            img.data[i] = 20 + v*230;
            img.data[i+1] = v*v*140;
            img.data[i+2] = v*20;
            img.data[i+3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
