<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dia Browser's gradient — ink</title>
    <meta name="description" content="A row of tall SVG bars, short at the sides, tall in the middle, painted with one rainbow a." />
    <link rel="canonical" href="https://ibra.info/ink/dia-gradient/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <header class="top">
        <h1>Dia Browser's gradient</h1>
        <a class="close" href="../" aria-label="close">×</a>
      </header>
      <p class="essay">
        A row of tall SVG bars, short at the sides, tall in the middle, painted with one rainbow and blurred until they melt. They scaleY up from the floor.
      </p>
      <section class="play">
        <div class="play-head"><span>Playground</span></div>
        <div class="stage">
          <iframe src="preview.html" title="Dia Browser's gradient"></iframe>
        </div>
        <form class="knobs">
        <label class="knob">
          <span>blur</span>
          <input type="range" name="blur" min="8" max="36" value="24" />
          <output data-output="blur">24</output>
        </label>
        <label class="knob">
          <span>bars</span>
          <input type="range" name="bars" min="7" max="13" value="9" />
          <output data-output="bars">9</output>
        </label>
        <div class="knob colors">
          <span>colors</span>
          <input type="color" name="colorA" value="#1b2430" aria-label="color a" />
          <input type="color" name="colorB" value="#e8b86d" aria-label="color b" />
          <input type="color" name="colorC" value="#e07a5f" aria-label="color c" />
        </div>
        </form>
      </section>
      <p class="actions">
        <button type="button" class="copy-pill" data-copy-detail>Copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
