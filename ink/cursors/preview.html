<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cursors</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#eceae3; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      function cursor(x, y, col) {
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x+12, y+18);
        ctx.lineTo(x+6, y+18);
        ctx.lineTo(x+10, y+28);
        ctx.lineTo(x+6, y+28);
        ctx.lineTo(x+2, y+18);
        ctx.lineTo(x, y+18);
        ctx.closePath();
        ctx.fill();
      }
      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 800;
        ctx.fillStyle = "#eceae3";
        ctx.fillRect(0, 0, w, h);
        const cols = ["#111","#c45c26","#3d6b4f","#6ea8c9"];
        cols.forEach((col, i) => {
          cursor(w*0.3 + Math.sin(t+i)*w*0.2, h*0.35 + Math.cos(t*0.8+i)*h*0.18, col);
        });
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
