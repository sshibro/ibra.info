<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wild-type</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#f4e1c1; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 180;
        ctx.fillStyle = "#f4e1c1";
        ctx.fillRect(0, 0, w, h);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const word = "shibro";
        [...word].forEach((ch, i) => {
          ctx.save();
          ctx.translate(w*0.22 + i*Math.min(w,h)*0.1, h/2);
          ctx.rotate(Math.sin(t + i)*0.25);
          ctx.scale(1 + Math.sin(t*1.3+i)*0.18, 1 + Math.cos(t+i)*0.18);
          ctx.font = "700 " + Math.floor(Math.min(w,h)*0.18) + "px ui-serif,Georgia,serif";
          ctx.fillStyle = "#1a120c";
          ctx.fillText(ch, 0, 0);
          ctx.restore();
        });
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
