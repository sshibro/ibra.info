<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel brushes — ink</title>
    <meta name="description" content="A brush is a small shape stamped over and over along a path, and a handful of numbers turn." />
    <link rel="canonical" href="https://ibra.info/ink/pixel-brushes/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <header class="top">
        <h1>Pixel brushes</h1>
        <a class="close" href="../" aria-label="close">×</a>
      </header>
      <p class="essay">
        A brush is a small shape stamped over and over along a path, and a handful of numbers turn the same code into a crisp line or a loose spray. Draw, or watch the spirals.
      </p>
      <section class="play">
        <div class="play-head"><span>Playground</span></div>
        <div class="stage">
          <iframe src="preview.html" title="Pixel brushes"></iframe>
        </div>
        <form class="knobs">
        <label class="knob">
          <span>spacing</span>
          <input type="range" name="spacing" min="0.04" max="0.28" step="0.01" value="0.09" />
          <output data-output="spacing">0.09</output>
        </label>
        <label class="knob">
          <span>scatter</span>
          <input type="range" name="scatter" min="0" max="0.22" step="0.01" value="0.04" />
          <output data-output="scatter">0.04</output>
        </label>
        <label class="knob">
          <span>size</span>
          <input type="range" name="size" min="0.02" max="0.1" step="0.005" value="0.04" />
          <output data-output="size">0.04</output>
        </label>
        </form>
      </section>
      <p class="actions">
        <button type="button" class="copy-pill" data-copy-detail>Copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
