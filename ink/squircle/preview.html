<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>squircle</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f4f4f1;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .pair {
        display: flex;
        align-items: end;
        gap: 1.75rem;
      }
      .col {
        display: grid;
        justify-items: center;
        gap: 0.55rem;
      }
      button {
        appearance: none;
        border: 0;
        margin: 0;
        width: 7.25rem;
        height: 7.25rem;
        color: #f4f4f1;
        background: #111;
        font: 400 1.05rem/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.03em;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 1px solid #111;
        outline-offset: 4px;
      }
      .round {
        border-radius: var(--r, 28px);
      }
      .note {
        font-size: 0.7rem;
        letter-spacing: 0.02em;
        color: #5c5c57;
      }
    </style>
  </head>
  <body>
    <div class="pair">
      <div class="col">
        <button type="button" class="round" id="round">shibro</button>
        <span class="note">radius</span>
      </div>
      <div class="col">
        <button type="button" id="smooth">shibro</button>
        <span class="note">smooth</span>
      </div>
    </div>
    <script>
      const CONFIG = {
        smoothness: 0.72
      };

      const smooth = document.getElementById("smooth");
      const round = document.getElementById("round");

      function path(w, h, r, n) {
        r = Math.min(Math.max(0, r), w / 2, h / 2);
        const p = 2 / n;
        const steps = 22;
        const pts = [];
        const corners = [
          [w - r, r, -Math.PI / 2],
          [w - r, h - r, 0],
          [r, h - r, Math.PI / 2],
          [r, r, Math.PI],
        ];
        for (const [cx, cy, a0] of corners) {
          for (let i = 0; i <= steps; i++) {
            const t = a0 + (i / steps) * (Math.PI / 2);
            const c = Math.cos(t);
            const s = Math.sin(t);
            pts.push(
              (cx + r * Math.sign(c) * Math.pow(Math.abs(c), p)).toFixed(2) +
                " " +
                (cy + r * Math.sign(s) * Math.pow(Math.abs(s), p)).toFixed(2)
            );
          }
        }
        return `M${pts[0]}L${pts.slice(1).join("L")}Z`;
      }

      function apply(c) {
        const t = Math.max(0, Math.min(1, Number(c.smoothness)));
        const n = 2 + t * 3.2;
        const r = 28;
        const w = smooth.offsetWidth;
        const h = smooth.offsetHeight;
        round.style.setProperty("--r", r + "px");
        smooth.style.clipPath = `path("${path(w, h, r, n)}")`;
      }

      apply(CONFIG);
      new ResizeObserver(() => apply(CONFIG)).observe(smooth);
      window.setParams = (c) => {
        Object.assign(CONFIG, c);
        apply(CONFIG);
      };
    </script>
  </body>
</html>
