<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>squircle</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #eceae4;
        font-family: ui-sans-serif, system-ui, sans-serif;
        color: #111;
      }
      .stage {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
      }
      .btn {
        appearance: none;
        border: 1px solid #e2e0d8;
        margin: 0;
        padding: 0.72rem 1.15rem;
        background: linear-gradient(180deg, #fff, #f3f2ed);
        color: #1a1a18;
        font: 400 0.95rem/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: -0.02em;
        box-shadow: 0 8px 20px rgba(20, 16, 10, 0.08);
      }
      .note {
        position: absolute;
        bottom: 0.7rem;
        font-size: 0.68rem;
        color: #7a7872;
      }
      .col { display: grid; justify-items: center; gap: 0.4rem; }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="col" id="plain-col" hidden>
        <button type="button" class="btn" id="plain">Get the app</button>
        <span class="note">radius</span>
      </div>
      <div class="col">
        <button type="button" class="btn" id="smooth">Get the app</button>
      </div>
    </div>
    <script>
      const CONFIG = {
        smoothness: 1,
        compare: 0
      };

      const smooth = document.getElementById("smooth");
      const plain = document.getElementById("plain");
      const plainCol = document.getElementById("plain-col");

      function path(w, h, r, n) {
        r = Math.min(Math.max(0, r), w / 2, h / 2);
        const p = 2 / n;
        const steps = 26;
        const pts = [];
        const corners = [
          [w - r, r, -Math.PI / 2],
          [w - r, h - r, 0],
          [r, h - r, Math.PI / 2],
          [r, r, Math.PI],
        ];
        for (const [cx, cy, a0] of corners) {
          for (let i = 0; i <= steps; i++) {
            const t = a0 + (i / steps) * (Math.PI / 2);
            const c = Math.cos(t);
            const s = Math.sin(t);
            pts.push(
              (cx + r * Math.sign(c) * Math.pow(Math.abs(c), p)).toFixed(2) +
                " " +
                (cy + r * Math.sign(s) * Math.pow(Math.abs(s), p)).toFixed(2)
            );
          }
        }
        return `path("M${pts[0]}L${pts.slice(1).join("L")}Z")`;
      }

      function apply(c) {
        const t = Math.max(0, Math.min(1, Number(c.smoothness)));
        const n = 2 + t * 3.4;
        const show = Number(c.compare) === 1;
        plainCol.hidden = !show;
        plain.style.borderRadius = "14px";
        smooth.style.clipPath = path(smooth.offsetWidth || 140, smooth.offsetHeight || 42, 16, n);
      }

      apply(CONFIG);
      new ResizeObserver(() => apply(CONFIG)).observe(smooth);
      window.setParams = (c) => {
        Object.assign(CONFIG, c);
        apply(CONFIG);
      };
    </script>
  </body>
</html>
