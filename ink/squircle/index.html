<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apple's corners — ink</title>
    <meta name="description" content="Superellipse clip-path versus a radius kink." />
    <link rel="canonical" href="https://ibra.info/ink/squircle/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <p class="back"><a href="../">ink</a></p>
      <h1>Apple's corners</h1>
      <p class="lede">
        A normal rounded corner has a tiny kink where the arc meets the flat.
        A superellipse eases in. Smoothness slides the exponent. A few chrome
        samples sit beside the comparison.
      </p>
      <div class="stage">
        <iframe src="preview.html" title="Apple's corners"></iframe>
      </div>
      <form class="knobs">
        <label class="knob">
          <span>smoothness</span>
          <input type="range" name="smoothness" min="0" max="1" step="0.02" value="0.72" />
          <output data-output="smoothness">0.72</output>
        </label>
      </form>
      <p class="actions">
        <button type="button" class="copy-code" data-copy-detail>copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
