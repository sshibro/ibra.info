<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>squircle — ink</title>
    <meta name="description" content="superellipse corners on a live button." />
    <link rel="canonical" href="https://ibra.info/ink/squircle/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <p class="back"><a href="../">ink</a></p>
      <h1>squircle</h1>
      <p class="lede">superellipse corners on a live button.</p>
      <div class="stage">
        <iframe src="preview.html" title="squircle"></iframe>
      </div>
      <form class="knobs">
        <label class="knob">
          <span>radius</span>
          <input type="range" name="radius" min="8" max="48" value="22" />
          <output data-output="radius">22</output>
        </label>
        <label class="knob">
          <span>smoothness</span>
          <input
            type="range"
            name="smoothness"
            min="1"
            max="4"
            step="0.1"
            value="2"
          />
          <output data-output="smoothness">2</output>
        </label>
      </form>
      <p class="actions">
        <button type="button" class="copy-code" data-copy-detail>copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
