<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apple's corners — ink</title>
    <meta name="description" content="Superellipse clip-path versus a radius kink." />
    <link rel="canonical" href="https://ibra.info/ink/squircle/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <header class="top">
        <h1>Apple's corners</h1>
        <a class="close" href="../" aria-label="close">×</a>
      </header>
      <p class="essay">
        A normal rounded corner has a tiny kink where it meets the flat edge.
        You feel it before you can name it. Apple fixes this with a squircle,
        a corner that eases in smooth. Here is the real one on a live button
        you can play with.
      </p>
      <section class="play">
        <div class="play-head">
          <span>Playground</span>
          <div class="play-tools">
            <button type="button" class="tool" data-compare aria-pressed="false">Compare</button>
            <button type="button" class="tool" data-remix>Remix</button>
          </div>
        </div>
        <div class="stage">
          <iframe src="preview.html" title="Apple's corners"></iframe>
        </div>
        <form class="knobs">
          <input type="hidden" name="compare" value="0" />
          <label class="knob">
            <span>Smoothing</span>
            <input type="range" name="smoothness" min="0" max="1" step="0.02" value="1" />
            <output data-output="smoothness">1</output>
          </label>
        </form>
      </section>
      <p class="actions">
        <button type="button" class="copy-pill" data-copy-detail>Copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
