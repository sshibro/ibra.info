<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>orbit</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#11110f; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      const cols = ["#c45c26","#3d6b4f","#6ea8c9","#e8a54b","#9b6b9d","#d76a6a"];
      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 1000;
        ctx.fillStyle = "#11110f";
        ctx.fillRect(0, 0, w, h);
        const n = 14;
        for (let i = 0; i < n; i++) {
          const a = t * 0.8 + (i / n) * Math.PI * 2;
          const r = Math.min(w, h) * 0.28;
          ctx.fillStyle = cols[i % cols.length];
          ctx.beginPath();
          ctx.ellipse(w/2 + Math.cos(a)*r, h/2 + Math.sin(a)*r*0.55, 16, 9, a, 0, Math.PI*2);
          ctx.fill();
        }
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
