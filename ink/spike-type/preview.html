<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>spike-type</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#f4f4f1; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 500;
        ctx.fillStyle = "#f4f4f1";
        ctx.fillRect(0, 0, w, h);
        ctx.translate(w/2, h/2);
        ctx.strokeStyle = "#111";
        for (let i = 0; i < 36; i++) {
          const a = (i / 36) * Math.PI * 2 + t * 0.1;
          const r = 30 + (Math.sin(t + i)*0.5+0.5)*50;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
          ctx.stroke();
        }
        ctx.fillStyle = "#f4f4f1";
        ctx.font = "700 " + Math.floor(Math.min(w,h)*0.14) + "px ui-sans-serif,system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#111";
        ctx.fillText("shibro", 0, 0);
        ctx.setTransform(1,0,0,1,0,0);
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
