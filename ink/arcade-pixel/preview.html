<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>arcade-pixel</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #f2c14e; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {
        text: "shibro",
        cells: 46,
        threshold: 0.52,
        ink: "#1a120c",
        paper: "#f2c14e"
      };

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true;
      let raf = 0;

      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });

      function label(s) {
        return String(s || "shibro").replace(/[^\x20-\x7E]/g, "").slice(0, 18) || "shibro";
      }

      function hex(h) {
        return [
          parseInt(h.slice(1, 3), 16),
          parseInt(h.slice(3, 5), 16),
          parseInt(h.slice(5, 7), 16),
        ];
      }

      function fit() {
        if (innerWidth < 8 || innerHeight < 8) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }

      function paint(now) {
        fit();
        const w = canvas.width;
        const h = canvas.height;
        const cells = Math.max(20, Math.round(Number(CONFIG.cells)));
        const sw = cells;
        const sh = Math.max(10, Math.round(cells * (h / w)));
        const small = document.createElement("canvas");
        small.width = sw;
        small.height = sh;
        const s = small.getContext("2d");
        s.fillStyle = CONFIG.paper;
        s.fillRect(0, 0, sw, sh);
        const t = quiet ? 0 : (now || 0) / 900;
        s.save();
        s.translate(sw / 2 + Math.sin(t) * 0.35, sh / 2 + 0.3);
        s.rotate(Math.sin(t * 0.35) * 0.018);
        s.fillStyle = CONFIG.ink;
        s.font = "700 " + Math.floor(sw * 0.22) + "px ui-sans-serif, system-ui, sans-serif";
        s.textAlign = "center";
        s.textBaseline = "middle";
        s.fillText(label(CONFIG.text), 0, 0);
        s.restore();
        const img = s.getImageData(0, 0, sw, sh);
        const cut = Number(CONFIG.threshold) * 255;
        const [ir, ig, ib] = hex(CONFIG.ink);
        const [pr, pg, pb] = hex(CONFIG.paper);
        for (let i = 0; i < img.data.length; i += 4) {
          const y = img.data[i] * 0.3 + img.data[i + 1] * 0.59 + img.data[i + 2] * 0.11;
          const on = y < cut;
          img.data[i] = on ? ir : pr;
          img.data[i + 1] = on ? ig : pg;
          img.data[i + 2] = on ? ib : pb;
          img.data[i + 3] = 255;
        }
        s.putImageData(img, 0, 0);
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = CONFIG.paper;
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(small, 0, 0, w, h);
      }

      function loop(now) {
        raf = 0;
        if (!view) return;
        paint(now);
        if (!quiet) raf = requestAnimationFrame(loop);
      }

      paint(0);
      if (quiet) paint(0);
      else raf = requestAnimationFrame(loop);

      window.setParams = (c) => {
        Object.assign(CONFIG, c);
        paint(performance.now());
      };
    </script>
  </body>
</html>
