<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arcade pixel — ink</title>
    <meta name="description" content="Chunky bitmap type on a lime arcade field." />
    <link rel="canonical" href="https://ibra.info/ink/arcade-pixel/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <header class="top">
        <h1>Arcade pixel</h1>
        <a class="close" href="../" aria-label="close">×</a>
      </header>
      <p class="essay">
        The word is a real 5×7 bitmap, blown up into chunky squares with a hard offset shadow, sitting on a lime field that breathes a little. Type your own word and drag the sliders.
      </p>
      <section class="play">
        <div class="play-head"><span>Playground</span></div>
        <div class="stage">
          <iframe src="preview.html" title="Arcade pixel"></iframe>
        </div>
        <form class="knobs">
        <label class="knob">
          <span>text</span>
          <input type="text" name="text" value="insert coin" maxlength="18" autocomplete="off" />
        </label>
        <label class="knob">
          <span>cells</span>
          <input type="range" name="cells" min="28" max="90" value="46" />
          <output data-output="cells">46</output>
        </label>
        <label class="knob">
          <span>threshold</span>
          <input type="range" name="threshold" min="0.2" max="0.85" step="0.01" value="0.52" />
          <output data-output="threshold">0.52</output>
        </label>
        <label class="knob">
          <span>ink</span>
          <input type="color" name="ink" value="#ffffff" />
        </label>
        <label class="knob">
          <span>paper</span>
          <input type="color" name="paper" value="#b8e832" />
        </label>
        </form>
      </section>
      <p class="actions">
        <button type="button" class="copy-pill" data-copy-detail>Copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
