<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>badge-trail</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#f4f4f1; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      const labels = ["ink","type","form","make"];
      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 900;
        ctx.fillStyle = "#f4f4f1";
        ctx.fillRect(0, 0, w, h);
        labels.forEach((lab, i) => {
          const a = t + i * 0.9;
          const x = w*0.2 + ((a * 80) % (w*0.7));
          const y = h*0.35 + Math.sin(a)*h*0.18;
          ctx.fillStyle = "#111";
          ctx.beginPath();
          ctx.roundRect(x, y, 54, 22, 11);
          ctx.fill();
          ctx.fillStyle = "#f4f4f1";
          ctx.font = "600 11px ui-sans-serif,system-ui,sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(lab, x+27, y+11);
        });
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
