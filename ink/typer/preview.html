<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>typer</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f4f4f1;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 2.4em;
        font-size: clamp(1.6rem, 8vw, 2.35rem);
        letter-spacing: -0.04em;
        line-height: 1;
      }
      .l {
        display: inline-block;
        padding: 0.14em 0.15em;
        margin: 0 -1px;
        visibility: hidden;
      }
      .l.on {
        visibility: visible;
      }
      .l.fill {
        background: var(--c, #c45c26);
        color: #f4f4f1;
      }
      .l.edge {
        box-shadow: inset 0 0 0 1.5px var(--c, #c45c26);
      }
      .l.solo {
        border-radius: 999px;
      }
      .l.start {
        border-radius: 999px 0 0 999px;
      }
      .l.mid {
        border-radius: 0;
      }
      .l.end {
        border-radius: 0 999px 999px 0;
      }
    </style>
  </head>
  <body>
    <p class="row" id="line" aria-live="polite"></p>
    <script>
      const CONFIG = {
        text: "shibro",
        speed: 1,
        color: "#c45c26"
      };

      const root = document.getElementById("line");
      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let letters = [];
      let start = performance.now();

      function label(s) {
        return String(s || "shibro").replace(/[^\x20-\x7E]/g, "").slice(0, 16) || "shibro";
      }

      function joinClass(states, i) {
        const hot = states[i] === "fill" || states[i] === "edge";
        if (!hot) return "";
        const prev = states[i - 1] === states[i];
        const next = states[i + 1] === states[i];
        if (prev && next) return "mid";
        if (prev) return "end";
        if (next) return "start";
        return "solo";
      }

      function render(text) {
        root.style.setProperty("--c", CONFIG.color);
        root.textContent = "";
        letters = [...text].map((ch) => {
          const span = document.createElement("span");
          span.className = "l";
          span.textContent = ch === " " ? "\u00a0" : ch;
          root.appendChild(span);
          return span;
        });
      }

      function statesAt(text, t) {
        const n = text.length;
        const typed = quiet ? n : Math.min(n, Math.floor(t / 0.09));
        const waveT = t - n * 0.09;
        const states = [];
        for (let i = 0; i < n; i++) {
          if (i >= typed) {
            states[i] = "off";
            continue;
          }
          if (quiet || waveT > n * 0.12 + 0.55) {
            states[i] = "plain";
            continue;
          }
          if (waveT < 0) {
            states[i] = "plain";
            continue;
          }
          const d = waveT / 0.1 - i;
          if (d < -0.2) states[i] = "plain";
          else if (d < 0.8) states[i] = "edge";
          else if (d < 2.2) states[i] = "fill";
          else if (d < 3.2) states[i] = "edge";
          else states[i] = "plain";
        }
        return states;
      }

      function paint(states) {
        letters.forEach((el, i) => {
          const s = states[i];
          el.className = "l" + (s === "off" ? "" : " on");
          if (s === "fill" || s === "edge") {
            el.classList.add(s, joinClass(states, i));
          }
        });
      }

      function cycleMs() {
        const n = label(CONFIG.text).length;
        return ((n * 0.09 + n * 0.12 + 1.4) * 1000) / CONFIG.speed;
      }

      function frame(now) {
        const text = label(CONFIG.text);
        if (letters.length !== text.length || root.dataset.text !== text) {
          render(text);
          root.dataset.text = text;
        }
        const len = cycleMs();
        const t = quiet ? 99 : ((now - start) % len) / 1000 * CONFIG.speed;
        paint(statesAt(text, t));
        root.style.setProperty("--c", CONFIG.color);
        requestAnimationFrame(frame);
      }

      render(label(CONFIG.text));
      if (quiet) paint(statesAt(label(CONFIG.text), 99));
      else requestAnimationFrame(frame);

      window.setParams = (c) => {
        Object.assign(CONFIG, c);
        start = performance.now();
        render(label(CONFIG.text));
        if (quiet) paint(statesAt(label(CONFIG.text), 99));
      };
    </script>
  </body>
</html>
