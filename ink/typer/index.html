<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The typer — ink</title>
    <meta name="description" content="Per-letter pills that merge with :has()." />
    <link rel="canonical" href="https://ibra.info/ink/typer/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <p class="back"><a href="../">ink</a></p>
      <h1>The typer</h1>
      <p class="lede">A wave runs the line. Each letter flickers through a solid pill, a highlight, an outline, then lands plain. Neighbors in the same state merge with :has().</p>
      <div class="stage">
        <iframe src="preview.html" title="typer"></iframe>
      </div>
      <form class="knobs">
        <label class="knob">
          <span>text</span>
          <input type="text" name="text" value="shibro" maxlength="16" autocomplete="off" />
        </label>
        <label class="knob">
          <span>speed</span>
          <input type="range" name="speed" min="0.4" max="2.4" step="0.1" value="1" />
          <output data-output="speed">1</output>
        </label>
        <label class="knob">
          <span>color</span>
          <input type="color" name="color" value="#c45c26" />
        </label>
      </form>
      <p class="actions">
        <button type="button" class="copy-code" data-copy-detail>copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
