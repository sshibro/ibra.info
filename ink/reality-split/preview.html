<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>reality-split</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#111; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 900;
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
        ctx.font = "700 " + Math.floor(Math.min(w,h)*0.2) + "px ui-sans-serif,system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const split = 0.5 + Math.sin(t)*0.08;
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, 0, w*split, h);
        ctx.clip();
        ctx.fillStyle = "#6ea8c9";
        ctx.fillText("shibro", w/2 - 8, h/2);
        ctx.restore();
        ctx.save();
        ctx.beginPath();
        ctx.rect(w*split, 0, w, h);
        ctx.clip();
        ctx.fillStyle = "#e07a5f";
        ctx.fillText("shibro", w/2 + 8, h/2);
        ctx.restore();
        ctx.fillStyle = "#f4f4f1";
        ctx.fillRect(w*split - 1, 0, 2, h);
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
