<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>image-galaxy</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#07070c; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      const stars = Array.from({length: 80}, () => ({ a: Math.random()*Math.PI*2, r: Math.random(), s: 0.4+Math.random()*1.2, c: 20+Math.random()*40 }));
      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 2000;
        ctx.fillStyle = "#07070c";
        ctx.fillRect(0, 0, w, h);
        stars.forEach((st) => {
          const a = st.a + t * st.s;
          const r = st.r * Math.min(w,h)*0.42;
          ctx.fillStyle = "hsl(" + st.c + " 70% 70%)";
          ctx.beginPath();
          ctx.arc(w/2 + Math.cos(a)*r, h/2 + Math.sin(a)*r*0.55, 1.6 + st.s, 0, Math.PI*2);
          ctx.fill();
        });
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
