<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dot-cut</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#111; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        if (innerWidth < 8 || innerHeight < 8) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 800;
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
        const off = document.createElement("canvas");
        off.width = w; off.height = h;
        const o = off.getContext("2d");
        o.fillStyle = "#fff";
        o.font = "700 " + Math.floor(Math.min(w,h)*0.2) + "px ui-sans-serif,system-ui,sans-serif";
        o.textAlign = "center";
        o.textBaseline = "middle";
        o.fillText("shibro", w/2, h/2);
        const img = o.getImageData(0,0,w,h);
        const step = 6;
        for (let y = 0; y < h; y += step) {
          for (let x = 0; x < w; x += step) {
            if (img.data[(y*w+x)*4+3] < 40) continue;
            const cut = (x/w) < (0.5 + Math.sin(t)*0.35);
            ctx.fillStyle = cut ? "#f4f4f1" : "#c45c26";
            ctx.beginPath();
            ctx.arc(x, y, 1.8, 0, Math.PI*2);
            ctx.fill();
          }
        }
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
