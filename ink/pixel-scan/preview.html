<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pixel-scan</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#111; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
        const off = document.createElement("canvas");
        off.width = 40; off.height = 20;
        const o = off.getContext("2d");
        o.fillStyle = "#fff";
        o.font = "700 12px ui-sans-serif,system-ui,sans-serif";
        o.textAlign = "center";
        o.textBaseline = "middle";
        o.fillText("shibro", 20, 11);
        ctx.imageSmoothingEnabled = false;
        const scan = quiet ? 1 : ((now || 0) % 2000) / 2000;
        ctx.drawImage(off, 0, 0, 40, 20*scan, 0, 0, w, h*scan);
        ctx.fillStyle = "#c45c26";
        ctx.fillRect(0, h*scan, w, 2);
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
