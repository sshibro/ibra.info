<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>slide-stack</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#eceae3; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        if (innerWidth < 8 || innerHeight < 8) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 1400;
        ctx.fillStyle = "#eceae3";
        ctx.fillRect(0, 0, w, h);
        const cols = ["#111","#c45c26","#3d6b4f"];
        for (let i = 0; i < 3; i++) {
          const x = w*0.22 + Math.sin(t + i)*18 + i*12;
          const y = h*0.32 + i*18;
          ctx.fillStyle = cols[i];
          ctx.fillRect(x, y, w*0.42, h*0.22);
          ctx.fillStyle = "#f4f4f1";
          ctx.font = "600 22px ui-sans-serif,system-ui,sans-serif";
          ctx.fillText("shibro", x+16, y+h*0.13);
        }
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
