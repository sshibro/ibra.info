<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>code-trail</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#080c0a; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      const cols = [];
      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height;
        const cw = 14, n = Math.ceil(w / cw);
        if (cols.length !== n) {
          cols.length = 0;
          for (let i = 0; i < n; i++) cols.push({ y: Math.random()*h, s: 40+Math.random()*80 });
        }
        ctx.fillStyle = "rgba(8,12,10,0.18)";
        ctx.fillRect(0, 0, w, h);
        ctx.font = "12px ui-monospace,monospace";
        ctx.textAlign = "center";
        cols.forEach((c, i) => {
          c.y = (c.y + (quiet ? 0 : c.s * 0.016)) % (h + 40);
          ctx.fillStyle = "#3d6b4f";
          ctx.fillText(String.fromCharCode(33 + ((i * 13 + Math.floor(c.y)) % 90)), i*cw + cw/2, c.y);
        });
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
