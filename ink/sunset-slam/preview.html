<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sunset-slam</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden;  }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height;
        const g = ctx.createLinearGradient(0, 0, 0, h);
        g.addColorStop(0, "#1b2430");
        g.addColorStop(0.55, "#e07a5f");
        g.addColorStop(1, "#f2c14e");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
        const p = quiet ? 1 : Math.min(1, ((now || 0) % 2200) / 700);
        const y = h * 0.42 + (1 - p) * h * 0.4;
        ctx.save();
        ctx.translate(w/2, y);
        ctx.scale(1, 0.35 + p * 0.65);
        ctx.fillStyle = "#f4f4f1";
        ctx.font = "700 " + Math.floor(Math.min(w,h)*0.16) + "px ui-sans-serif,system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("shibro", 0, 0);
        ctx.restore();
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
