<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ghosty reveal — ink</title>
    <meta name="description" content="A generated cloudy mask — several times taller than the box — slides with mask-position. T." />
    <link rel="canonical" href="https://ibra.info/ink/ghost/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <header class="top">
        <h1>Ghosty reveal</h1>
        <a class="close" href="../" aria-label="close">×</a>
      </header>
      <p class="essay">
        A generated cloudy mask — several times taller than the box — slides with mask-position. The edge is soft fog, not a fade.
      </p>
      <section class="play">
        <div class="play-head"><span>Playground</span></div>
        <div class="stage">
          <iframe src="preview.html" title="Ghosty reveal"></iframe>
        </div>
        <form class="knobs">
        <label class="knob">
          <span>softness</span>
          <input type="range" name="softness" min="8" max="40" value="22" />
          <output data-output="softness">22</output>
        </label>
        <label class="knob">
          <span>direction</span>
          <select name="direction">
            <option value="down" selected>down</option>
            <option value="up">up</option>
            <option value="right">right</option>
            <option value="left">left</option>
          </select>
        </label>
        <label class="knob">
          <span>duration</span>
          <input type="range" name="duration" min="0.8" max="4" step="0.1" value="2.6" />
          <output data-output="duration">2.6</output>
        </label>
        </form>
      </section>
      <p class="actions">
        <button type="button" class="copy-pill" data-copy-detail>Copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
