<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ransom</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f4f4f1;
      }
      .row {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 0.28rem;
        padding: 0.4rem;
      }
      .scrap {
        display: grid;
        place-items: center;
        min-width: 1.15em;
        padding: 0.28em 0.32em 0.22em;
        line-height: 1;
        color: #1a1a1a;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.12), 0 6px 10px rgba(20, 16, 8, 0.08);
      }
    </style>
  </head>
  <body>
    <p class="row" id="row"></p>
    <script>
      const CONFIG = {
        text: "shibro",
        messiness: 0.65,
        seed: 1
      };

      const row = document.getElementById("row");
      const faces = [
        "Georgia, ui-serif, serif",
        "Palatino, Palatino Linotype, ui-serif, serif",
        "ui-monospace, Courier New, monospace",
        "Impact, Haettenschweiler, Arial Narrow Bold, sans-serif",
        "ui-serif, Times New Roman, serif",
      ];
      const papers = ["#f3ead3", "#efe6d6", "#f7f1e2", "#e8dcc6", "#f0e7d4"];
      const clips = [
        "polygon(3% 8%, 96% 2%, 100% 90%, 92% 100%, 4% 94%, 0 18%)",
        "polygon(0 6%, 88% 0, 100% 12%, 97% 100%, 8% 96%, 2% 40%)",
        "polygon(6% 0, 100% 8%, 94% 100%, 0 88%)",
        "polygon(0 0, 100% 4%, 96% 86%, 80% 100%, 2% 92%)",
        "polygon(4% 10%, 100% 0, 92% 100%, 0 84%)",
      ];

      function label(s) {
        return String(s || "shibro").replace(/[^\x20-\x7E]/g, "").slice(0, 12) || "shibro";
      }

      function rng(seed) {
        let a = seed >>> 0 || 1;
        return () => {
          a |= 0;
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function apply(c) {
        const text = label(c.text);
        const m = Math.max(0, Math.min(1, Number(c.messiness)));
        const rand = rng(Number(c.seed) || 1);
        row.textContent = "";
        [...text].forEach((ch) => {
          const el = document.createElement("span");
          el.className = "scrap";
          el.textContent = ch === " " ? "\u00a0" : ch;
          const rot = (rand() - 0.5) * m * 28;
          const lift = (rand() - 0.5) * m * 10;
          const size = 1.55 + (rand() - 0.5) * m * 0.7;
          const paper = papers[(rand() * papers.length) | 0];
          el.style.fontFamily = faces[(rand() * faces.length) | 0];
          el.style.fontSize = size + "rem";
          el.style.transform = `rotate(${rot.toFixed(1)}deg) translateY(${lift.toFixed(1)}px)`;
          el.style.clipPath = clips[(rand() * clips.length) | 0];
          el.style.background = `
            repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(40,30,10,0.035) 2px, rgba(40,30,10,0.035) 3px),
            repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(40,30,10,0.03) 3px, rgba(40,30,10,0.03) 4px),
            ${paper}
          `;
          row.appendChild(el);
        });
      }

      apply(CONFIG);
      window.setParams = (c) => {
        Object.assign(CONFIG, c);
        apply(CONFIG);
      };
    </script>
  </body>
</html>
