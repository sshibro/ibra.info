<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gold-scar</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#1a1612; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 900;
        ctx.fillStyle = "#1a1612";
        ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = "#d9b36a";
        ctx.font = "700 " + Math.floor(Math.min(w,h)*0.2) + "px ui-serif,Georgia,serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("shibro", w/2, h/2);
        ctx.globalCompositeOperation = "lighter";
        ctx.strokeStyle = "rgba(255,220,140,0.8)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(w*0.18, h*0.62 + Math.sin(t)*6);
        ctx.quadraticCurveTo(w*0.5, h*0.3 + Math.cos(t)*8, w*0.82, h*0.58);
        ctx.stroke();
        ctx.globalCompositeOperation = "source-over";
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
