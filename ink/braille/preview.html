<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>braille</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f4f4f1;
        color: #111;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .spin {
        font-size: clamp(2.6rem, 14vw, 3.6rem);
        letter-spacing: 0.18em;
        line-height: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .spin::after {
          content: "⣿⡇⠀" !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <span class="spin" id="spin" role="img" aria-label="loading">⣿⠀⠀</span>
    <script>
      const CONFIG = {};
      const frames = [
        "⣿⠀⠀",
        "⢸⣿⠀",
        "⠀⣿⡇",
        "⠀⠀⣿",
        "⠀⢸⣿",
        "⣿⡇⠀",
      ];
      const el = document.getElementById("spin");
      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true;
      let i = 0;
      let timer = 0;
      function play(on) {
        view = on;
        clearInterval(timer);
        if (!quiet && view) {
          timer = setInterval(() => {
            i = (i + 1) % frames.length;
            el.textContent = frames[i];
          }, 110);
        }
      }
      if (!quiet) play(true);
      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ink-visible") play(!!e.data.value);
      });
    </script>
  </body>
</html>
