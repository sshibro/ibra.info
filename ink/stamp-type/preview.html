<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stamp-type</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#efe6d6; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height;
        ctx.fillStyle = "#efe6d6";
        ctx.fillRect(0, 0, w, h);
        const word = "shibro";
        ctx.font = "700 " + Math.floor(Math.min(w,h)*0.2) + "px ui-serif,Georgia,serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const cycle = 2200;
        const t = quiet ? 1 : ((now || 0) % cycle) / cycle;
        [...word].forEach((ch, i) => {
          const on = t > i / word.length;
          ctx.save();
          ctx.translate(w*0.22 + i * Math.min(w,h)*0.1, h/2);
          ctx.rotate(on ? (i-2.5)*0.04 : 0);
          ctx.globalAlpha = on ? 1 : 0.08;
          ctx.fillStyle = "#3a2214";
          ctx.fillText(ch, 0, on && !quiet ? Math.sin(((now||0)+i*80)/90)*2 : 0);
          ctx.restore();
        });
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
