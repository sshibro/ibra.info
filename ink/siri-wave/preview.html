<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>siri-wave</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#0e0e10; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 400;
        ctx.fillStyle = "#0e0e10";
        ctx.fillRect(0, 0, w, h);
        const cols = ["#7aa2ff","#c58cff","#ff8ad4"];
        cols.forEach((col, k) => {
          ctx.beginPath();
          ctx.strokeStyle = col;
          ctx.lineWidth = 2.2;
          ctx.globalAlpha = 0.85 - k * 0.15;
          for (let x = 0; x <= w; x += 4) {
            const y = h/2 + Math.sin(x/40 + t + k) * (18 + k*8) * Math.sin(x/w*Math.PI);
            if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        });
        ctx.globalAlpha = 1;
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
