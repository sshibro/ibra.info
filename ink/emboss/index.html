<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realistic emboss — ink</title>
    <meta name="description" content="The word is a height field. Normals come from neighboring samples, then a light skims the ." />
    <link rel="canonical" href="https://ibra.info/ink/emboss/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <header class="top">
        <h1>Realistic emboss</h1>
        <a class="close" href="../" aria-label="close">×</a>
      </header>
      <p class="essay">
        The word is a height field. Normals come from neighboring samples, then a light skims the surface. Depth and angle are knobs.
      </p>
      <section class="play">
        <div class="play-head"><span>Playground</span></div>
        <div class="stage">
          <iframe src="preview.html" title="Realistic emboss"></iframe>
        </div>
        <form class="knobs">
        <label class="knob">
          <span>word</span>
          <input type="text" name="word" value="shibro" maxlength="12" autocomplete="off" />
        </label>
        <label class="knob">
          <span>depth</span>
          <input type="range" name="depth" min="0.4" max="3.2" step="0.1" value="1.6" />
          <output data-output="depth">1.6</output>
        </label>
        <label class="knob">
          <span>light</span>
          <input type="range" name="light" min="0" max="6.28" step="0.05" value="3.9" />
          <output data-output="light">3.9</output>
        </label>
        </form>
      </section>
      <p class="actions">
        <button type="button" class="copy-pill" data-copy-detail>Copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
