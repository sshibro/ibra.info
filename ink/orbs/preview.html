<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>orbs</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #14120f;
      }
      .stage {
        position: absolute;
        inset: -20%;
        filter: blur(18px);
      }
      .orb {
        position: absolute;
        border-radius: 50%;
        mix-blend-mode: screen;
        animation: drift var(--t, 9s) ease-in-out infinite alternate;
      }
      .o1 {
        width: 46%;
        height: 58%;
        left: 8%;
        top: 18%;
        background: #c45c26;
        --t: 8s;
      }
      .o2 {
        width: 38%;
        height: 48%;
        right: 10%;
        top: 8%;
        background: #3d6b4f;
        --t: 11s;
        animation-delay: -2s;
      }
      .o3 {
        width: 28%;
        height: 36%;
        left: 36%;
        bottom: 10%;
        background: #d4a017;
        --t: 7s;
        animation-delay: -4s;
      }
      .o4 {
        width: 22%;
        height: 28%;
        right: 22%;
        bottom: 22%;
        background: #7eb8c9;
        --t: 10s;
      }
      @keyframes drift {
        to {
          transform: translate3d(12%, -10%, 0) scale(1.08);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .orb {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="stage" aria-hidden="true">
      <i class="orb o1"></i>
      <i class="orb o2"></i>
      <i class="orb o3"></i>
      <i class="orb o4"></i>
    </div>
    <script>
      const CONFIG = {};
    </script>
  </body>
</html>
