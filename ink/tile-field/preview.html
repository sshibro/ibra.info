<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tile-field</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#111; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        if (innerWidth < 8 || innerHeight < 8) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 700;
        const n = 10;
        const s = Math.min(w, h) / n;
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            const v = 0.5 + 0.5 * Math.sin(t + x*0.4 + y*0.35);
            ctx.fillStyle = "hsl(" + (40 + v*40) + " 40% " + (18+v*40) + "%)";
            const m = 2 + v * 4;
            ctx.fillRect(x*s+m, y*s+m, s-m*2, s-m*2);
          }
        }
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
