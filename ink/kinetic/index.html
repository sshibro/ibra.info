<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kinetic typography — ink</title>
    <meta name="description" content="A letter sliced into bands that slip like a cut in motion." />
    <link rel="canonical" href="https://ibra.info/ink/kinetic/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <header class="top">
        <h1>Kinetic typography</h1>
        <a class="close" href="../" aria-label="close">×</a>
      </header>
      <p class="essay">
        A letter is sliced into thin horizontal bands. Each band slips a little, so the glyph feels like it is being cut in motion.
      </p>
      <section class="play">
        <div class="play-head"><span>Playground</span></div>
        <div class="stage">
          <iframe src="preview.html" title="Kinetic typography"></iframe>
        </div>
        <form class="knobs">
        <label class="knob">
          <span>letter</span>
          <input type="text" name="letter" value="a" maxlength="1" autocomplete="off" />
        </label>
        <label class="knob">
          <span>tiles</span>
          <input type="range" name="tiles" min="8" max="32" value="18" />
          <output data-output="tiles">18</output>
        </label>
        <label class="knob">
          <span>amount</span>
          <input type="range" name="amount" min="0" max="16" value="7" />
          <output data-output="amount">7</output>
        </label>
        </form>
      </section>
      <p class="actions">
        <button type="button" class="copy-pill" data-copy-detail>Copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
