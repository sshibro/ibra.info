<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kinetic — ink</title>
    <meta name="description" content="one letter, sliced, sine." />
    <link rel="canonical" href="https://ibra.info/ink/kinetic/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <p class="back"><a href="../">ink</a></p>
      <h1>kinetic</h1>
      <p class="lede">one letter, sliced, sine.</p>
      <div class="stage">
        <iframe src="preview.html" title="kinetic"></iframe>
      </div>
      <form class="knobs">
        <label class="knob">
          <span>letter</span>
          <input type="text" name="letter" value="s" maxlength="1" autocomplete="off" />
        </label>
        <label class="knob">
          <span>tiles</span>
          <input type="range" name="tiles" min="4" max="14" value="8" />
          <output data-output="tiles">8</output>
        </label>
        <label class="knob">
          <span>amount</span>
          <input type="range" name="amount" min="0" max="16" value="7" />
          <output data-output="amount">7</output>
        </label>
      </form>
      <p class="actions">
        <button type="button" class="copy-code" data-copy-detail>copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
