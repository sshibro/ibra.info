<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kinetic</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background: #f4f4f1; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {
        letter: "a",
        tiles: 18,
        amount: 10
      };

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true;
      let raf = 0;
      let src = null;

      window.addEventListener("message", (e) => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });

      function glyph(s) {
        const t = String(s || "a").replace(/[^\x20-\x7E]/g, "").slice(0, 1);
        return t || "a";
      }

      function fit() {
        if (innerWidth < 8 || innerHeight < 8) return;
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
          src = null;
        }
      }

      function drawLetter() {
        const off = document.createElement("canvas");
        off.width = canvas.width;
        off.height = canvas.height;
        const o = off.getContext("2d");
        o.fillStyle = "#f4f4f1";
        o.fillRect(0, 0, off.width, off.height);
        o.fillStyle = "#111";
        const size = Math.min(off.width, off.height) * 0.72;
        o.font = "700 " + Math.floor(size) + "px ui-serif, Georgia, serif";
        o.textAlign = "center";
        o.textBaseline = "middle";
        o.fillText(glyph(CONFIG.letter), off.width / 2, off.height / 2 + size * 0.04);
        return off;
      }

      function paint(now) {
        fit();
        if (canvas.width < 8) return;
        if (!src) src = drawLetter();
        const n = Math.max(8, Math.min(36, Math.round(CONFIG.tiles)));
        const amp = quiet ? 0 : Number(CONFIG.amount);
        const th = Math.floor(src.height / n);
        const t = (now || 0) / 380;
        ctx.fillStyle = "#f4f4f1";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let j = 0; j < n; j++) {
          const sy = j * th;
          const ox = Math.sin(t + j * 0.55) * amp * (j % 2 ? 1 : -0.7);
          const blur = Math.abs(Math.sin(t * 0.8 + j * 0.3)) * amp * 0.15;
          ctx.drawImage(src, 0, sy, src.width, th, ox - blur, sy, src.width + blur * 2, th);
        }
      }

      function loop(now) {
        raf = 0;
        if (!view) return;
        paint(now);
        if (!quiet) raf = requestAnimationFrame(loop);
      }

      paint(0);
      if (!quiet) raf = requestAnimationFrame(loop);

      window.setParams = (c) => {
        Object.assign(CONFIG, c);
        src = null;
        paint(performance.now());
      };
    </script>
  </body>
</html>
