<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dot-globe</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#111; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      const dots = [];
      for (let i = 0; i < 180; i++) {
        const u = Math.acos(2 * Math.random() - 1);
        const v = Math.random() * Math.PI * 2;
        dots.push({ u, v });
      }
      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 1800;
        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, w, h);
        const R = Math.min(w, h) * 0.32;
        dots.forEach((d) => {
          const x = Math.sin(d.u) * Math.cos(d.v + t);
          const y = Math.cos(d.u);
          const z = Math.sin(d.u) * Math.sin(d.v + t);
          ctx.fillStyle = z > 0 ? "#e8c36a" : "#3d4a3a";
          ctx.beginPath();
          ctx.arc(w/2 + x * R, h/2 + y * R, z > 0 ? 2.4 : 1.4, 0, Math.PI*2);
          ctx.fill();
        });
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
