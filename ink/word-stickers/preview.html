<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>word-stickers</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#f4f4f1; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        canvas.width = Math.floor(innerWidth * dpr);
        canvas.height = Math.floor(innerHeight * dpr);
      }


      const bits = [
        { t:"shi", r:-8, x:0.32, y:0.42, c:"#f2c14e" },
        { t:"bro", r:6, x:0.58, y:0.48, c:"#e07a5f" },
        { t:"ink", r:-3, x:0.46, y:0.64, c:"#7aa2b2" }
      ];
      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 700;
        ctx.fillStyle = "#f4f4f1";
        ctx.fillRect(0, 0, w, h);
        bits.forEach((b, i) => {
          ctx.save();
          ctx.translate(b.x*w, b.y*h + Math.sin(t+i)*4);
          ctx.rotate((b.r + Math.sin(t+i)*2) * Math.PI/180);
          ctx.fillStyle = b.c;
          ctx.fillRect(-36, -16, 72, 32);
          ctx.fillStyle = "#111";
          ctx.font = "700 16px ui-sans-serif,system-ui,sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(b.t, 0, 1);
          ctx.restore();
        });
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
