<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bond-type</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { overflow: hidden; background:#f4f4f1; }
      canvas { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script>
      const CONFIG = {};
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");

      const quiet = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let view = true, raf = 0;
      window.addEventListener("message", e => {
        if (e.data && e.data.type === "ink-visible") {
          view = !!e.data.value;
          if (view && !raf) loop();
        }
      });
      function fit() {
        const dpr = Math.min(2, devicePixelRatio || 1);
        const w = Math.floor(innerWidth * dpr);
        const h = Math.floor(innerHeight * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
      }


      function paint(now) {
        fit();
        const w = canvas.width, h = canvas.height, t = (now || 0) / 700;
        ctx.fillStyle = "#f4f4f1";
        ctx.fillRect(0, 0, w, h);
        const word = "shibro";
        const pts = [...word].map((_, i) => ({
          x: w*0.22 + i*Math.min(w,h)*0.1,
          y: h/2 + Math.sin(t + i)*12
        }));
        ctx.strokeStyle = "#c45c26";
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y));
        ctx.stroke();
        ctx.fillStyle = "#111";
        ctx.font = "600 " + Math.floor(Math.min(w,h)*0.14) + "px ui-sans-serif,system-ui,sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        pts.forEach((p, i) => ctx.fillText(word[i], p.x, p.y));
      }
      function loop(now) { raf = 0; if (!view) return; paint(now); if (!quiet) raf = requestAnimationFrame(loop); }
  
      if (quiet) { fit(); paint(0); }
      else raf = requestAnimationFrame(loop);
    </script>
  </body>
</html>
