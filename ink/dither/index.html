<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dither — ink</title>
    <meta name="description" content="a chart, one-bit." />
    <link rel="canonical" href="https://ibra.info/ink/dither/" />
    <meta name="theme-color" content="#f4f4f1" />
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../ink.css" />
  </head>
  <body>
    <main class="doc">
      <p class="back"><a href="../">ink</a></p>
      <h1>dither</h1>
      <p class="lede">a chart, one-bit.</p>
      <div class="stage">
        <iframe src="preview.html" title="dither"></iframe>
      </div>
      <form class="knobs">
        <label class="knob">
          <span>density</span>
          <input type="range" name="density" min="1" max="8" value="5" />
          <output data-output="density">5</output>
        </label>
        <label class="knob">
          <span>threshold</span>
          <input
            type="range"
            name="threshold"
            min="0.15"
            max="0.85"
            step="0.05"
            value="0.5"
          />
          <output data-output="threshold">0.5</output>
        </label>
      </form>
      <p class="actions">
        <button type="button" class="copy-code" data-copy-detail>copy code</button>
      </p>
    </main>
    <script src="../ink.js"></script>
    <script>
      Ink.detail();
    </script>
  </body>
</html>
