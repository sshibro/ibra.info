<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dither</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f4f4f1;
      }
      canvas {
        display: block;
        width: min(92%, 320px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="320" height="180" aria-label="dithered sparkline"></canvas>
    <script>
      const CONFIG = {
        density: 5,
        threshold: 0.5
      };

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      const BAYER = [
        [0, 32, 8, 40, 2, 34, 10, 42],
        [48, 16, 56, 24, 50, 18, 58, 26],
        [12, 44, 4, 36, 14, 46, 6, 38],
        [60, 28, 52, 20, 62, 30, 54, 22],
        [3, 35, 11, 43, 1, 33, 9, 41],
        [51, 19, 59, 27, 49, 17, 57, 25],
        [15, 47, 7, 39, 13, 45, 5, 37],
        [63, 31, 55, 23, 61, 29, 53, 21],
      ];
      const series = Array.from({ length: 72 }, (_, i) => {
        const t = i / 71;
        return (
          0.42 +
          0.22 * Math.sin(t * Math.PI * 2.2) +
          0.16 * Math.sin(t * Math.PI * 5.4 + 0.4) +
          0.08 * Math.sin(t * 18)
        );
      });

      function apply(c) {
        const w = canvas.width;
        const h = canvas.height;
        const cell = Math.max(1, 9 - Math.round(c.density));
        const bias = (Number(c.threshold) - 0.5) * 90;
        ctx.fillStyle = "#f4f4f1";
        ctx.fillRect(0, 0, w, h);
        const off = document.createElement("canvas");
        off.width = w;
        off.height = h;
        const o = off.getContext("2d");
        o.fillStyle = "#f4f4f1";
        o.fillRect(0, 0, w, h);
        o.beginPath();
        series.forEach((v, i) => {
          const x = (i / (series.length - 1)) * (w - 16) + 8;
          const y = h - 18 - v * (h - 36);
          if (i === 0) o.moveTo(x, h);
          else if (i === 1) o.lineTo(x, y);
          else o.lineTo(x, y);
        });
        o.lineTo(w - 8, h);
        o.closePath();
        const grad = o.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, "#111");
        grad.addColorStop(1, "#b8b4aa");
        o.fillStyle = grad;
        o.fill();
        const img = o.getImageData(0, 0, w, h);
        const out = ctx.createImageData(w, h);
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const gx = Math.floor(x / cell);
            const gy = Math.floor(y / cell);
            const g = img.data[i] * 0.3 + img.data[i + 1] * 0.59 + img.data[i + 2] * 0.11;
            const t = (BAYER[gy & 7][gx & 7] / 64) * 255;
            const on = g < t + bias;
            const v = on ? 17 : 244;
            out.data[i] = out.data[i + 1] = out.data[i + 2] = v;
            out.data[i + 3] = 255;
          }
        }
        ctx.putImageData(out, 0, 0);
      }

      apply(CONFIG);
      window.setParams = (c) => {
        Object.assign(CONFIG, c);
        apply(CONFIG);
      };
    </script>
  </body>
</html>
