<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dither</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #f4f4f1;
      }
      canvas {
        display: block;
        width: min(92%, 360px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <canvas id="c" width="360" height="200" aria-label="dithered sparkline"></canvas>
    <script>
      const CONFIG = {
        density: 5,
        threshold: 0.5
      };

      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const series = Array.from({ length: 48 }, (_, i) => {
        const t = i / 47;
        return (
          0.4 +
          0.22 * Math.sin(t * Math.PI * 2.2) +
          0.16 * Math.sin(t * Math.PI * 5.4 + 0.4) +
          0.08 * Math.sin(t * 16)
        );
      });

      function apply(c) {
        const density = Math.max(1, Math.min(8, Math.round(c.density)));
        const sw = 28 + density * 10;
        const sh = Math.round(sw * (200 / 360));
        const small = document.createElement("canvas");
        small.width = sw;
        small.height = sh;
        const s = small.getContext("2d");
        s.fillStyle = "#f4f4f1";
        s.fillRect(0, 0, sw, sh);
        s.beginPath();
        series.forEach((v, i) => {
          const x = 1 + (i / (series.length - 1)) * (sw - 2);
          const y = sh - 2 - v * (sh - 4);
          if (i === 0) s.moveTo(x, sh);
          s.lineTo(x, y);
        });
        s.lineTo(sw - 1, sh);
        s.closePath();
        s.fillStyle = "#111";
        s.fill();

        const img = s.getImageData(0, 0, sw, sh);
        const cut = Number(c.threshold) * 255;
        for (let i = 0; i < img.data.length; i += 4) {
          const y =
            img.data[i] * 0.3 + img.data[i + 1] * 0.59 + img.data[i + 2] * 0.11;
          const v = y < cut ? 17 : 244;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        s.putImageData(img, 0, 0);

        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = "#f4f4f1";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(small, 0, 0, canvas.width, canvas.height);
      }

      apply(CONFIG);
      window.setParams = (c) => {
        Object.assign(CONFIG, c);
        apply(CONFIG);
      };
    </script>
  </body>
</html>
